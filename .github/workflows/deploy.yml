name: Deploy
on:
  push:
    branches:
      - main
    paths:
      - app/**
      - infra/**
      - .github/workflows/deploy.yml
      - .github/actions/setup-node-npm/**

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sandbox:
    runs-on: ubuntu-slim
    environment: sandbox
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-node-npm
        with:
          working-directory: infra
      - uses: ./.github/actions/setup-node-npm
        with:
          working-directory: app
      - name: Build app
        working-directory: app
        run: npm run build
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.AWS_BLOG_SANDBOX_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1
      - name: Deploy SandboxGithubDeployRoleStack
        working-directory: infra
        run: npx cdk deploy SandboxGithubDeployRoleStack --require-approval never
        env:
          AWS_BLOG_SANDBOX_ACCOUNT_ID: ${{ vars.AWS_BLOG_SANDBOX_ACCOUNT_ID }}
          AWS_BLOG_PRODUCTION_ACCOUNT_ID: ${{ vars.AWS_BLOG_PRODUCTION_ACCOUNT_ID }}
      - name: Deploy SandboxDnsStack
        working-directory: infra
        run: npx cdk deploy SandboxDnsStack --require-approval never
        env:
          AWS_BLOG_SANDBOX_ACCOUNT_ID: ${{ vars.AWS_BLOG_SANDBOX_ACCOUNT_ID }}
          AWS_BLOG_PRODUCTION_ACCOUNT_ID: ${{ vars.AWS_BLOG_PRODUCTION_ACCOUNT_ID }}
      - name: Deploy SandboxHostingStack
        working-directory: infra
        run: npx cdk deploy SandboxHostingStack --require-approval never
        env:
          AWS_BLOG_SANDBOX_ACCOUNT_ID: ${{ vars.AWS_BLOG_SANDBOX_ACCOUNT_ID }}
          AWS_BLOG_PRODUCTION_ACCOUNT_ID: ${{ vars.AWS_BLOG_PRODUCTION_ACCOUNT_ID }}

  e2e-test:
    needs: sandbox
    runs-on: ubuntu-slim
    steps:
      - name: DNS解決を確認する
        run: |
          set -euo pipefail
          remote_ip=$(curl -sS -o /dev/null -w '%{remote_ip}' https://sandbox.blog.gobo-cello.com/)
          if [ -z "$remote_ip" ]; then
            echo "DNS解決に失敗しました: sandbox.blog.gobo-cello.com" >&2
            exit 1
          fi
          echo "sandbox.blog.gobo-cello.com -> $remote_ip"
      - name: アプリケーション配信を確認する
        run: |
          set -euo pipefail
          base_url="https://sandbox.blog.gobo-cello.com"

          # sitemapに書かれたURLはbuild時に固定されたsite("https://blog.gobo-cello.com")の
          # ホスト名を含む(sandbox/productionでsiteContentPathを共用しているため)。
          # ホスト名は無視し、pathだけをsandboxのbase_urlに付け替えて確認する。
          fetch_paths() {
            curl -sS -f --retry 3 --retry-delay 2 "$1" \
              | grep -oE '<loc>[^<]+</loc>' \
              | sed -E 's#</?loc>##g; s#^https?://[^/]+##'
          }

          shard_paths=()
          while IFS= read -r line; do
            shard_paths+=("$line")
          done < <(fetch_paths "$base_url/sitemap-index.xml")

          if [ "${#shard_paths[@]}" -eq 0 ]; then
            echo "sitemap-index.xmlからshardを取得できませんでした" >&2
            exit 1
          fi

          page_paths=()
          for shard_path in "${shard_paths[@]}"; do
            while IFS= read -r line; do
              page_paths+=("$line")
            done < <(fetch_paths "$base_url$shard_path")
          done

          if [ "${#page_paths[@]}" -eq 0 ]; then
            echo "sitemapからページを取得できませんでした" >&2
            exit 1
          fi

          for path in "${page_paths[@]}"; do
            url="$base_url$path"
            status=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 2 "$url")
            if [ "$status" != "200" ]; then
              echo "FAIL: GET $url -> $status (expected 200)" >&2
              exit 1
            fi
            echo "OK: GET $url -> $status"
          done

          missing_path_status=$(curl -sS -o /dev/null -w '%{http_code}' "$base_url/e2e-test-nonexistent-path/")
          if [ "$missing_path_status" != "404" ]; then
            echo "FAIL: 存在しないパスへのアクセスが404を返しませんでした ($missing_path_status)" >&2
            exit 1
          fi
          echo "OK: 存在しないパス -> 404"

  production:
    needs: [sandbox, e2e-test]
    runs-on: ubuntu-slim
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-node-npm
        with:
          working-directory: infra
      - uses: ./.github/actions/setup-node-npm
        with:
          working-directory: app
      - name: Build app
        working-directory: app
        run: npm run build
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.AWS_BLOG_PRODUCTION_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1
      - name: Deploy ProductionGithubDeployRoleStack
        working-directory: infra
        run: npx cdk deploy ProductionGithubDeployRoleStack --require-approval never
        env:
          AWS_BLOG_SANDBOX_ACCOUNT_ID: ${{ vars.AWS_BLOG_SANDBOX_ACCOUNT_ID }}
          AWS_BLOG_PRODUCTION_ACCOUNT_ID: ${{ vars.AWS_BLOG_PRODUCTION_ACCOUNT_ID }}
      # ProductionGithubDeployRoleStackがus-east-1へのAssumeRole許可を追加した直後は、
      # 同じcdk deployコマンドでus-east-1のstackを一括指定すると、CDKがCloudFormation
      # 更新完了前にus-east-1のasset publishing roleを解決しようとして失敗するため、
      # 別stepとしてIAM Policy更新の反映後に実行する。
      - name: Deploy ProductionDnsStack
        working-directory: infra
        run: npx cdk deploy ProductionDnsStack --require-approval never
        env:
          AWS_BLOG_SANDBOX_ACCOUNT_ID: ${{ vars.AWS_BLOG_SANDBOX_ACCOUNT_ID }}
          AWS_BLOG_PRODUCTION_ACCOUNT_ID: ${{ vars.AWS_BLOG_PRODUCTION_ACCOUNT_ID }}
          SANDBOX_SUBDOMAIN_NAME_SERVERS: ${{ vars.SANDBOX_SUBDOMAIN_NAME_SERVERS }}
      - name: Deploy ProductionHostingStack
        working-directory: infra
        # ProductionHostingStackはProductionDnsStackのhostedZone/certificateを
        # cross-stack参照するため、このcdk deployは依存先のProductionDnsStackも
        # 再合成・再デプロイする。SANDBOX_SUBDOMAIN_NAME_SERVERSを渡さないと、
        # ProductionDnsStackのNS委譲レコードが未指定と判定され削除されてしまう。
        run: npx cdk deploy ProductionHostingStack --require-approval never
        env:
          AWS_BLOG_SANDBOX_ACCOUNT_ID: ${{ vars.AWS_BLOG_SANDBOX_ACCOUNT_ID }}
          AWS_BLOG_PRODUCTION_ACCOUNT_ID: ${{ vars.AWS_BLOG_PRODUCTION_ACCOUNT_ID }}
          SANDBOX_SUBDOMAIN_NAME_SERVERS: ${{ vars.SANDBOX_SUBDOMAIN_NAME_SERVERS }}
